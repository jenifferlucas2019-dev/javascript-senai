<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Empréstimo - Plumas de Avalon</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        #resultado { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Plumas de Avalon</h2>
    <p>Simulador de Empréstimo</p>
    
    <label>Salário (R$):</label>
    <input type="number" id="salario" placeholder="Ex: 2000">

    <label>Valor do Empréstimo (R$):</label>
    <input type="number" id="valor" placeholder="Ex: 5000">

    <label>Nº de Prestações:</label>
    <input type="number" id="parcelas" placeholder="Ex: 12">

    <button onclick="analisarEmprestimo()">Analisar Crédito</button>

    <div id="resultado"></div>
</div>

<script>
    function analisarEmprestimo() {
        // Pegando os valores dos inputs
        const salario = parseFloat(document.getElementById('salario').value);
        const valor = parseFloat(document.getElementById('valor').value);
        const parcelas = parseInt(document.getElementById('parcelas').value);
        const divResultado = document.getElementById('resultado');

        // Validação de valores positivos
        if (salario <= 0 || valor <= 0 || parcelas <= 0 || isNaN(salario)) {
            divResultado.style.color = "red";
            divResultado.innerHTML = "Erro: Informe valores válidos!";
            return;
        }

        // Lógica do cálculo
        const valorPrestacao = valor / parcelas;
        const limite = salario * 0.30;

        // Verificação da regra
        if (valorPrestacao <= limite) {
            divResultado.style.color = "green";
            divResultado.innerHTML = "✅ Empréstimo Concedido!<br>Parcela: R$ " + valorPrestacao.toFixed(2);
        } else {
            divResultado.style.color = "red";
            divResultado.innerHTML = "❌ Negado. Parcela (R$ " + valorPrestacao.toFixed(2) + ") excede 30% do salário.";
        }
    }
</script>

</body>
</html>
